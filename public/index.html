<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>全景查看器</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23101317' stroke='%23e0a45c' stroke-width='2'/%3E%3Cpath d='M5 18c4-5 7-5 11 0s7 5 11 0' fill='none' stroke='%23f3efe6' stroke-width='1.4'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <canvas id="view"></canvas>
  <header>
    <div class="brand"><span class="mark"></span>全景查看器</div>
    <form id="dir-form">
      <input id="dir" spellcheck="false" autocomplete="off" placeholder="全景图所在文件夹" aria-label="全景图文件夹" />
      <button type="submit" class="primary">打开</button>
    </form>
    <div id="count"></div>
    <button id="toggle-list" type="button">隐藏图集</button>
  </header>
  <aside id="list" aria-label="全景图列表"></aside>
  <p id="error" hidden></p>
  <div id="loading" hidden>
    <div id="loading-text">正在打开…</div>
    <div class="track"><div id="loading-bar"></div></div>
  </div>
  <footer>
    <div id="meta">
      <strong id="shot-name">尚未打开图片</strong>
      <span id="detail"></span>
      <span id="angles"></span>
    </div>
    <div class="tools">
      <button id="prev" type="button">上一张</button>
      <button id="next" type="button">下一张</button>
      <button id="level" type="button">平视</button>
      <button id="down" type="button">俯视</button>
      <button id="reset" type="button">重置</button>
      <button id="auto" type="button" aria-pressed="false">自动旋转</button>
      <button id="full" type="button">全屏</button>
      <label class="fov">视场
        <input id="fov" type="range" min="35" max="110" value="70" />
        <span id="fov-val">70°</span>
      </label>
      <label>清晰度
        <select id="quality" aria-label="清晰度">
          <option value="4096">流畅</option>
          <option value="8192" selected>标准</option>
          <option value="16384">原图</option>
        </select>
      </label>
      <span class="hint">拖动环视 · 滚轮缩放 · 方向键环视 · N/P 切换 · 空格旋转 · F 全屏 · R 重置</span>
    </div>
  </footer>
  <script src="/app.js"></script>
</body>
</html>
